<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: 'Inter', sans-serif;
      background-color: #0f1117;
      color: #e2e8f0;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #6366f1;
    }
    p {
      margin: 8px 0 16px;
      font-size: 13px;
      color: #94a3b8;
    }
    .eip-btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      margin-bottom: 8px;
      transition: background-color 0.2s;
    }
    .eip-btn-primary:hover {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
    }
    .eip-btn-secondary {
      background: #1e2433;
      color: #e2e8f0;
      border: 1px solid #2d3748;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
    }
    #logo {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .theme-toggle {
      background: none;
      border: none;
      color: #e2e8f0;
      font-size: 20px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="logo">🔍</div>
  <h1>Element Inspector Pro</h1>
  <p>Test Automation Selector Generator</p>
  <button id="theme-toggle" class="theme-toggle" title="Toggle light/dark mode">🌙</button>
  <button id="open-inspector" class="eip-btn-primary">Open Inspector Panel</button>
  <button id="close-panel" class="eip-btn-secondary">Close Panel</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
